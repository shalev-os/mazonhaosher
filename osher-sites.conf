server {
    listen 127.0.0.1:8081;
    listen [::1]:8081;
    server_name osher.cc www.osher.cc;

    root /var/www/osher.cc;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

